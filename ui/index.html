<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger Hub</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #677085; --line: #e2e5eb;
    --accent: #2f6fed; --accent-ink: #ffffff; --accent-soft: #e8effd; --ok: #1e8e5a; --warn: #b26a00;
    --danger: #c23b3b; --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --ink: #e7eaf0; --muted: #98a1b3; --line: #2c323d;
      --accent: #6b9bff; --accent-ink: #0d1220; --accent-soft: #22304d; --ok: #4cc38a; --warn: #e0a54a;
      --danger: #f07171; --chip: #262b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .me { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  header .spacer { flex: 1; }
  .dirty { color: var(--warn); font-weight: 600; }
  .saved { color: var(--ok); }
  input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { min-height: 64px; resize: vertical; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.small { padding: 3px 9px; font-size: 13px; }
  button.danger { color: var(--danger); }
  main { display: grid; grid-template-columns: 240px 1fr; gap: 20px; padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  nav .org { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 10px 12px; }
  nav .org.active { background: var(--accent-soft); border-color: var(--accent); }
  nav .org small { display: block; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .panel h2 .count { color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.off .title { color: var(--muted); text-decoration: line-through; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .chip.match { background: var(--accent-soft); color: var(--accent); }
  .chip.in { background: transparent; border: 1px solid var(--line); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 180px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .list { max-height: 460px; overflow: auto; }
  .empty { color: var(--muted); padding: 14px 0; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .namebox { max-width: 340px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    header { padding: 12px 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <a href="/" id="backapp" style="color:var(--accent);text-decoration:none;display:none">← App</a>
  <h1>Messenger Hub · Chats &amp; orgs</h1>
  <div class="me"><span>Your name in chats</span><input id="me" style="width:180px"></div>
  <div class="spacer"></div>
  <span id="savestate"></span>
  <button id="revert">Discard changes</button>
  <button id="save" class="primary" disabled>Save</button>
</header>

<main>
  <nav>
    <div id="orgs"></div>
    <button id="neworg" style="width:100%">+ New organisation</button>
    <p class="hint" style="margin-top:14px">Nothing here downloads messages. Chats are only read when you run
      <code>hub.py sync</code> or <code>run</code>, and only the enabled ones.</p>
  </nav>

  <section id="editor"></section>
</main>
<div class="toast" id="toast"></div>

<script>
let S = null;          // server state
let cfg = null;        // working copy of orgs.json
let current = null;    // selected org key
let view = { q: "", mode: "suggested" };
let dirty = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tid = (url) => ((url || "").match(/\/t\/([^/?#]+)/) || [, (url || "").replace(/\/+$/, "")])[1];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}

function setDirty(v) {
  dirty = v;
  $("#save").disabled = !v;
  $("#savestate").innerHTML = v ? '<span class="dirty">Unsaved changes</span>' : "";
}

async function load() {
  S = await (await fetch("/api/state")).json();
  cfg = structuredClone(S.config);
  if (!cfg.orgs[current]) current = Object.keys(cfg.orgs)[0] || null;
  setDirty(false);
  render();
}

async function save() {
  const r = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
  if (!r.ok) { toast("Couldn't save: " + ((await r.json()).error || r.status)); return; }
  S = await r.json();
  cfg = structuredClone(S.config);
  setDirty(false);
  $("#savestate").innerHTML = '<span class="saved">Saved</span>';
  render();
}

function change(fn) { fn(); setDirty(true); render(); }

function matcher(org) {
  if (!org || !org.match) return null;
  try { return new RegExp(org.match, "i"); } catch { return null; }
}

function render() {
  $("#me").value = cfg.me || "";
  const keys = Object.keys(cfg.orgs);
  $("#orgs").innerHTML = keys.map((k) => {
    const o = cfg.orgs[k];
    const on = o.chats.filter((c) => c.enabled !== false).length;
    return `<button class="org ${k === current ? "active" : ""}" data-org="${esc(k)}">${esc(o.name)}
      <small>${esc(k)} · ${on} chat${on === 1 ? "" : "s"}${o.chats.length > on ? ` (+${o.chats.length - on} paused)` : ""}</small></button>`;
  }).join("") || '<p class="empty">No organisations yet.</p>';
  renderEditor();
}

function renderEditor() {
  const ed = $("#editor");
  const org = cfg.orgs[current];
  if (!org) { ed.innerHTML = '<div class="panel"><p class="empty">Create an organisation to start picking its group chats.</p></div>'; return; }
  const re = matcher(org);
  const inOrg = new Set(org.chats.map((c) => tid(c.thread)));
  const known = Object.fromEntries(S.chatList.chats.map((c) => [c.id, c]));

  const chatRows = org.chats.map((c, i) => {
    const s = S.synced[tid(c.thread)];
    const k = known[tid(c.thread)];
    const status = s ? `${s.messages} messages · synced ${esc((s.synced || "").replace("T", " ").slice(0, 16))}` : "not synced yet";
    return `<div class="row ${c.enabled === false ? "off" : ""}">
      <label class="switch" title="${c.enabled === false ? "Paused: skipped by sync and analysis" : "Enabled"}"><input type="checkbox" data-toggle="${i}" ${c.enabled === false ? "" : "checked"}><span></span></label>
      <div class="grow">
        <input class="namebox" data-rename="${i}" value="${esc(c.name || (k && k.label) || "")}" placeholder="${esc(c.thread)}">
        <div class="sub">${status} · <a href="${esc(c.thread)}" target="_blank" rel="noopener">${esc(tid(c.thread))}</a></div>
      </div>
      <button class="small danger" data-remove="${i}">Remove</button>
    </div>`;
  }).join("") || '<p class="empty">No chats yet. Add them from the list below.</p>';

  const q = view.q.trim().toLowerCase();
  let pool = S.chatList.chats.filter((c) => !q || c.label.toLowerCase().includes(q) || (c.preview || "").toLowerCase().includes(q));
  if (view.mode === "suggested") pool = re ? pool.filter((c) => re.test(c.label)) : [];
  pool.sort((a, b) => (inOrg.has(a.id) - inOrg.has(b.id)) || ((re && !re.test(a.label)) - (re && !re.test(b.label))));
  const otherOrgs = (id) => Object.entries(cfg.orgs).filter(([k, o]) => k !== current && o.chats.some((c) => tid(c.thread) === id)).map(([k]) => k);
  const poolRows = pool.slice(0, 300).map((c) => {
    const added = inOrg.has(c.id);
    const others = otherOrgs(c.id);
    return `<div class="row">
      <div class="grow">
        <div class="title">${esc(c.label)}${re && re.test(c.label) ? '<span class="chip match">matches</span>' : ""}${others.map((k) => `<span class="chip in">in ${esc(k)}</span>`).join("")}</div>
        <div class="sub">${esc(c.preview || "")}</div>
      </div>
      ${added ? '<span class="chip">added</span>' : `<button class="small" data-add="${esc(c.id)}">+ Add</button>`}
    </div>`;
  }).join("");
  const unadded = pool.filter((c) => !inOrg.has(c.id));
  const listAt = S.chatList.at ? S.chatList.at.replace("T", " ").slice(0, 16) : "never";

  ed.innerHTML = `
  <div class="panel">
    <h2>${esc(org.name)} <span class="count">settings</span></h2>
    <div class="grid">
      <div><label>Name</label><input data-field="name" value="${esc(org.name)}"></div>
      <div><label>Key (folder name: data/orgs/${esc(current)})</label><input value="${esc(current)}" disabled></div>
      <div><label>Suggest chats whose name matches</label><input data-field="match" value="${esc(org.match || "")}" placeholder="e.g. ECG  or  IMES|IE Talks">
        <div class="hint">${org.match && !re ? "Not a valid pattern." : "Only highlights chats below; nothing is added automatically."}</div></div>
      <div><label>Reports to always keep (comma separated)</label><input data-field="outputs" value="${esc((org.outputs || []).join(", "))}" placeholder="e.g. roadmap, calendar, budget">
        <div class="hint">Claude always keeps a dashboard and tracker, and adds others when the chats call for them.</div></div>
      <div class="full"><label>About this org (helps the analysis)</label><textarea data-field="context" placeholder="What the org does, your role, what you care about tracking">${esc(org.context || "")}</textarea></div>
    </div>
    <div style="margin-top:12px; text-align:right"><button class="small danger" id="delorg">Delete organisation</button></div>
  </div>

  <div class="panel">
    <h2>Group chats in this org <span class="count">${org.chats.length}</span></h2>
    <div class="list">${chatRows}</div>
  </div>

  <div class="panel">
    <h2>Add chats <span class="count">from your chat list · ${S.chatList.chats.length} chats · refreshed ${esc(listAt)}</span></h2>
    <div class="toolbar">
      <input id="q" placeholder="Search chats" value="${esc(view.q)}">
      <div class="seg"><button data-mode="suggested" class="${view.mode === "suggested" ? "on" : ""}">Matches</button><button data-mode="all" class="${view.mode === "all" ? "on" : ""}">All chats</button></div>
      ${unadded.length > 1 ? `<button class="small" id="addall">+ Add all ${unadded.length} shown</button>` : ""}
      <button class="small" id="discover" ${S.discovering ? "disabled" : ""}>${S.discovering ? "Refreshing…" : "Refresh chat list"}</button>
    </div>
    <div class="list">${poolRows || `<p class="empty">${view.mode === "suggested" && !re ? 'Set "Suggest chats whose name matches" above, or switch to All chats.' : "No chats match."}</p>`}</div>
    <div class="toolbar" style="margin-top:12px">
      <input id="manual" placeholder="Or paste a chat link: https://www.facebook.com/messages/t/…">
      <button class="small" id="addmanual">Add link</button>
    </div>
    <p class="hint">"Refresh chat list" opens Messenger in the hub's browser window to read your chat names. It doesn't read any messages.</p>
  </div>`;
  if (view.focus) { const el = $("#q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); view.focus = false; }
}

function addChat(org, thread, name) {
  if (org.chats.some((c) => tid(c.thread) === tid(thread))) return false;
  org.chats.push({ thread, name: name || null, slug: null, enabled: true });
  return true;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-org]");
  if (!t) return;
  const org = cfg.orgs[current];
  if (t.dataset.org) { current = t.dataset.org; view.q = ""; render(); }
  else if (t.id === "save") save();
  else if (t.id === "revert") { if (!dirty || confirm("Discard unsaved changes?")) load(); }
  else if (t.id === "neworg") {
    const name = prompt("Organisation name (e.g. ECG Organization)");
    if (!name) return;
    let key = (prompt("Short key, used for its folder", name.split(/\s+/)[0].toLowerCase()) || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (!key) return;
    if (cfg.orgs[key]) { toast(`"${key}" already exists`); return; }
    change(() => { cfg.orgs[key] = { name, chats: [] }; current = key; });
  }
  else if (t.id === "delorg") {
    if (confirm(`Delete "${org.name}" from the config? Its synced chats and reports in data/ stay on disk.`)) change(() => { delete cfg.orgs[current]; current = Object.keys(cfg.orgs)[0] || null; });
  }
  else if (t.dataset.remove !== undefined) change(() => org.chats.splice(+t.dataset.remove, 1));
  else if (t.dataset.add) {
    const c = S.chatList.chats.find((x) => x.id === t.dataset.add);
    change(() => addChat(org, c.url, c.label));
  }
  else if (t.id === "addall") {
    const re = matcher(org); const q = view.q.trim().toLowerCase();
    let pool = S.chatList.chats.filter((c) => !q || c.label.toLowerCase().includes(q) || (c.preview || "").toLowerCase().includes(q));
    if (view.mode === "suggested") pool = re ? pool.filter((c) => re.test(c.label)) : [];
    const n = pool.filter((c) => !org.chats.some((x) => tid(x.thread) === c.id)).length;
    if (confirm(`Add ${n} chats to ${org.name}?`)) change(() => pool.forEach((c) => addChat(org, c.url, c.label)));
  }
  else if (t.id === "addmanual") {
    const v = $("#manual").value.trim();
    if (!/\/t\/[^/?#]+/.test(v)) { toast("Paste a link like https://www.facebook.com/messages/t/123…"); return; }
    change(() => { if (!addChat(org, v.split("?")[0], null)) toast("Already in this org"); });
  }
  else if (t.dataset.mode) { view.mode = t.dataset.mode; render(); }
  else if (t.id === "discover") {
    await fetch("/api/discover", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    S.discovering = true; render(); toast("Reading your chat list in the hub's browser window…");
    const poll = setInterval(async () => {
      const s = await (await fetch("/api/state")).json();
      if (!s.discovering) { clearInterval(poll); S.chatList = s.chatList; S.synced = s.synced; S.discovering = false; render(); toast(`Chat list refreshed: ${s.chatList.chats.length} chats`); }
    }, 2500);
  }
});

document.addEventListener("change", (e) => {
  const t = e.target; const org = cfg.orgs[current];
  if (t.dataset.toggle !== undefined) change(() => { org.chats[+t.dataset.toggle].enabled = t.checked; });
});

document.addEventListener("input", (e) => {
  const t = e.target; const org = cfg.orgs[current];
  if (t.id === "me") { cfg.me = t.value; setDirty(true); }
  else if (t.id === "q") { view.q = t.value; view.focus = true; renderEditor(); }
  else if (t.dataset.rename !== undefined) { org.chats[+t.dataset.rename].name = t.value; setDirty(true); }
  else if (t.dataset.field) {
    const f = t.dataset.field;
    if (f === "outputs") org.outputs = t.value.split(",").map((x) => x.trim()).filter(Boolean);
    else org[f] = t.value;
    setDirty(true);
    if (f === "name") { const b = document.querySelector(`[data-org="${CSS.escape(current)}"]`); if (b) b.firstChild.textContent = t.value; }
    if (f === "match") { const pos = t.selectionStart; renderEditor(); const el = document.querySelector('[data-field="match"]'); el.focus(); el.setSelectionRange(pos, pos); }
  }
});

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (dirty) save(); } });
load();
if (location.pathname === "/config") document.getElementById("backapp").style.display = "";
</script>
</body>
</html>
